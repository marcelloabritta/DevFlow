services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: devflow-redis
    ports:
    - "6379:6379"

volumes:
  postgres-data: